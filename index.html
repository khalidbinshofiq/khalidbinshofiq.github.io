<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khalid-Bin-Shofiq | Urban & Regional Planner</title>
  <meta name="description" content="Portfolio of Khalid-Bin-Shofiq — Urban & Regional Planner working with GeoAI, GIS, remote sensing, urban growth modelling and transportation planning.">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       1. VARIABLES
       ===================================================== */
    :root{
      --max-width: 1480px;
      --font: "Inter", Arial, Helvetica, "Segoe UI", Roboto, sans-serif;
      /* Light */
      --bg: #f4f7f9;
      --surface: #ffffff;
      --surface-soft: #f7f9fb;
      --surface-hover: #eef4f7;
      --text: #182631;
      --text-soft: #647583;
      --accent: #146f8d;
      --accent-dark: #0e5870;
      --accent-soft: rgba(20,111,141,.10);
      --green: #388874;
      --border: #dce6eb;
      --shadow: 0 5px 18px rgba(30,55,70,.07);
      --shadow-hover: 0 16px 40px rgba(30,55,70,.13);
      --radius: 18px;
      --radius-small: 12px;
      --nav-height: 72px;
    }

    html[data-theme="dark"]{
      --bg: #0d1216;
      --surface: #141b20;
      --surface-soft: #192227;
      --surface-hover: #202b31;
      --text: #edf3f6;
      --text-soft: #9cabb5;
      --accent: #58b7d4;
      --accent-dark: #77c9e1;
      --accent-soft: rgba(88,183,212,.12);
      --green: #68bea7;
      --border: rgba(255,255,255,.09);
      --shadow: 0 8px 28px rgba(0,0,0,.28);
      --shadow-hover: 0 18px 48px rgba(0,0,0,.42);
    }

    /* =====================================================
       2. RESET
       ===================================================== */
    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; scroll-padding-top: 92px; }
    body{
      margin: 0;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      background: radial-gradient(circle at 0% 0%, var(--accent-soft), transparent 30%), var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body, button, input, textarea, select{ font-family: var(--font); }
    img{ max-width: 100%; }
    a{ color: inherit; text-decoration: none; }
    button{ color: inherit; }

    /* =====================================================
       3. SCROLL PROGRESS
       ===================================================== */
    .progress{ position: fixed; top: 0; left: 0; z-index: 9999; width: 100%; height: 3px; background: transparent; }
    #progressBar{ width: 0; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); }

    /* =====================================================
       4. NAVIGATION
       ===================================================== */
    .navbar{
      position: sticky; top: 0; z-index: 2000;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 89%, transparent);
      backdrop-filter: blur(18px);
    }
    .nav-inner{
      width: min(calc(100% - 48px), var(--max-width));
      min-height: var(--nav-height);
      margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 28px;
    }
    /* Brand */
    .brand{ min-width: 220px; display: flex; align-items: center; gap: 12px; }
    .brand-dot{ width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
    .brand-name{ display: block; font-size: 14px; font-weight: 800; letter-spacing: -.2px; }
    .brand-role{ display: block; margin-top: 1px; color: var(--text-soft); font-size: 11px; }
    /* Desktop Nav */
    .desktop-nav{ flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .desktop-nav a{
      padding: 9px 10px; border-radius: 9px; color: var(--text-soft);
      font-size: 12px; font-weight: 700;
      transition: color .18s ease, background .18s ease;
    }
    .desktop-nav a:hover, .desktop-nav a.active{ color: var(--text); background: var(--surface-hover); }
    /* Nav Actions */
    .nav-actions{ display: flex; align-items: center; gap: 8px; }
    .nav-button{
      min-height: 38px; padding: 8px 11px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 11px; font-weight: 700;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .nav-button:hover{ transform: translateY(-1px); background: var(--surface-hover); box-shadow: var(--shadow); }
    .menu-button{ display: none; }

    /* =====================================================
       5. MOBILE DRAWER
       ===================================================== */
    .mobile-overlay{
      position: fixed; inset: 0; z-index: 4000;
      visibility: hidden; opacity: 0;
      background: rgba(0,0,0,.45); backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }
    .mobile-overlay.show{ visibility: visible; opacity: 1; }
    .mobile-menu{
      position: fixed; top: 0; right: 0; z-index: 4100;
      width: min(350px,88vw); height: 100vh; padding: 20px; overflow-y: auto;
      border-left: 1px solid var(--border); background: var(--surface);
      box-shadow: -20px 0 55px rgba(0,0,0,.22);
      transform: translateX(100%); transition: transform .24s ease;
    }
    .mobile-menu.open{ transform: translateX(0); }
    .mobile-menu-head{ margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
    .mobile-menu nav{ display: grid; gap: 8px; }
    .mobile-menu nav a{
      padding: 12px 13px; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13px; font-weight: 700;
    }
    .mobile-menu nav a:hover{ background: var(--surface-hover); }

    /* =====================================================
       6. PAGE
       ===================================================== */
    .page{ width: min(calc(100% - 48px), var(--max-width)); margin: 26px auto 60px; }

    /* =====================================================
       7. HERO
       ===================================================== */
    .hero{
      position: relative; overflow: hidden; margin-bottom: 22px; padding: 34px;
      display: grid; grid-template-columns: 205px minmax(0,1fr) 330px; gap: 34px; align-items: center;
      border: 1px solid var(--border); border-radius: 24px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .hero::after{
      content: ""; position: absolute; top: -150px; right: -100px;
      width: 380px; height: 380px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    }
    /* Portrait */
    .portrait-wrap{ position: relative; width: 190px; height: 190px; }
    .portrait-wrap::before{ content: ""; position: absolute; inset: -8px; border: 1px solid var(--border); border-radius: 50%; }
    .portrait{
      width: 190px; height: 190px; display: block; object-fit: cover; border-radius: 50%;
      box-shadow: 0 12px 32px rgba(20,45,60,.16);
    }
    .availability{
      position: absolute; right: 4px; bottom: 12px; width: 18px; height: 18px;
      border: 4px solid var(--surface); border-radius: 50%; background: #38a169;
    }
    /* Hero Text */
    .eyebrow{
      margin-bottom: 10px; display: inline-flex; color: var(--accent);
      font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    }
    .hero h1{
      margin: 0; color: var(--text); font-size: clamp(38px,3vw,50px);
      line-height: 1.08; font-weight: 800; letter-spacing: -1.7px;
    }
    .hero-role{ margin-top: 10px; color: var(--text-soft); font-size: 17px; font-weight: 700; }
    .hero-description{
      max-width: 760px; margin: 15px 0 0; color: var(--text-soft);
      font-size: 15px; line-height: 1.75;
      text-align: justify; text-justify: inter-word; hyphens: auto;
    }
    .hero-actions{ margin-top: 20px; display: flex; flex-wrap: wrap; gap: 9px; }

    /* =====================================================
       8. BUTTONS
       ===================================================== */
    .button{
      min-height: 40px; padding: 9px 14px;
      display: inline-flex; justify-content: center; align-items: center; gap: 7px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 12px; font-weight: 800;
      transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }
    .button:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }
    .button.primary{ border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.primary:hover{ background: var(--accent-dark); }
    .button.ghost:hover{ background: var(--surface-hover); }
    .mini-button{
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 10px; line-height: 1.2; font-weight: 800;
      transition: transform .16s ease, background .16s ease;
    }
    .mini-button:hover{ transform: translateY(-1px); background: var(--surface-hover); }

    /* =====================================================
       9. HERO FOCUS PANEL
       ===================================================== */
    .focus-panel{
      position: relative; z-index: 2; padding: 20px;
      border: 1px solid var(--border); border-radius: 16px; background: var(--surface-soft);
    }
    .mini-title{
      margin-bottom: 12px; color: var(--text-soft);
      font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    }
    .focus-tags{ display: flex; flex-wrap: wrap; gap: 7px; }
    .tag{
      padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--text); font-size: 10.5px; font-weight: 700;
      transition: transform .16s ease, background .16s ease;
    }
    .tag:hover{ transform: translateY(-2px); background: var(--accent-soft); }
    .stats{ margin-top: 16px; display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .stat{ padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .stat strong{ display: block; color: var(--text); font-size: 18px; line-height: 1; font-weight: 800; }
    .stat span{ display: block; margin-top: 5px; color: var(--text-soft); font-size: 9px; line-height: 1.35; }

    /* =====================================================
       10. MAIN GRID
       ===================================================== */
    .portfolio-layout{ display: grid; grid-template-columns: minmax(0,1fr) 350px; align-items: start; gap: 22px; }
    .main-column{ min-width: 0; }
    .side-column{ min-width: 0; display: grid; gap: 18px; }

    /* =====================================================
       11. GENERAL SECTION
       ===================================================== */
    .section-card{
      margin-bottom: 22px; padding: 25px; scroll-margin-top: 90px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .side-card{
      padding: 20px; scroll-margin-top: 90px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .section-head{ margin-bottom: 19px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    .section-label{
      margin-bottom: 4px; color: var(--accent);
      font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    }
    h2{ margin: 0; color: var(--text); font-size: 23px; line-height: 1.25; font-weight: 800; letter-spacing: -.5px; }
    .section-subtitle{ max-width: 650px; margin: 6px 0 0; color: var(--text-soft); font-size: 12.5px; line-height: 1.6; }

    /* =====================================================
       12. CURRENT RESEARCH
       ===================================================== */
    .research-grid{ display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .research-card{
      position: relative; overflow: hidden; min-height: 195px; padding: 18px;
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 14px; background: var(--surface-soft);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .research-card::before{ content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: var(--accent); }
    .research-card:hover{
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
      box-shadow: var(--shadow);
    }
    .research-number{ color: var(--accent); font-size: 10px; font-weight: 800; }
    .research-card h3{ margin: 9px 0 8px; color: var(--text); font-size: 15px; line-height: 1.45; font-weight: 800; }
    .research-card p{ margin: 0; color: var(--text-soft); font-size: 11px; line-height: 1.55; }
    .card-actions{ margin-top: auto; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }

    /* =====================================================
       13. RECENT PROJECTS — BENTO GALLERY
       All projects are listed in the RECENT_PROJECTS array
       (JavaScript, near the bottom). Cards are built from it.
       ===================================================== */
    .pg-head{ flex-wrap: wrap; }
    .pg-stats{ flex: 0 0 auto; display: flex; gap: 7px; }
    .pg-stat{
      min-width: 74px; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-soft);
    }
    .pg-stat strong{ display: block; color: var(--text); font-size: 20px; line-height: 1; font-weight: 800; letter-spacing: -.5px; }
    .pg-stat span{
      display: block; margin-top: 5px; color: var(--text-soft);
      font-size: 8.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    }

    /* Filter chips */
    .pg-filters{ margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 7px; }
    .pg-chip{
      padding: 7px 8px 7px 12px; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--text-soft); cursor: pointer;
      font-size: 11px; font-weight: 800;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .pg-chip:hover{ color: var(--text); transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .pg-chip .pg-chip-n{
      min-width: 21px; padding: 2px 6px; border-radius: 999px;
      background: var(--surface-hover); color: var(--text-soft);
      font-size: 9.5px; line-height: 1.3; text-align: center;
    }
    .pg-chip.active{ border-color: var(--accent); background: var(--accent); color: #fff; }
    .pg-chip.active .pg-chip-n{ background: rgba(255,255,255,.22); color: #fff; }
    html[data-theme="dark"] .pg-chip.active{ color: #06222c; }
    html[data-theme="dark"] .pg-chip.active .pg-chip-n{ background: rgba(0,0,0,.16); color: #06222c; }

    /* Grid: 3 columns, fixed row height, spans make the bento shape */
    #recent-projects{ container-type: inline-size; }
    .pg-grid{
      display: grid; grid-template-columns: repeat(3,minmax(0,1fr));
      grid-auto-rows: 215px; grid-auto-flow: dense; gap: 14px;
    }
    /* Row height follows the column width so every card keeps a ~3:2 shape */
    @supports (width: 1cqw){
      .pg-grid{ grid-auto-rows: calc((100cqw - 28px) / 3 / 1.5); }
    }
    .pg-grid:not(.is-filtered) .pg-card.size-feature{ grid-column: span 2; grid-row: span 2; }
    .pg-grid:not(.is-filtered) .pg-card.size-tall{ grid-row: span 2; }
    .pg-grid:not(.is-filtered) .pg-card.size-wide{ grid-column: span 2; }
    .pg-grid:not(.is-expanded):not(.is-filtered) .pg-card.is-extra{ display: none; }

    /* Card */
    .pg-card{
      position: relative; min-width: 0; overflow: hidden; isolation: isolate;
      border-radius: 16px; background: #0b151b;
      box-shadow: 0 4px 16px rgba(20,40,55,.10);
      transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
      animation: pgIn .6s cubic-bezier(.2,.8,.2,1) backwards;
      animation-delay: calc(var(--i, 0) * 55ms);
    }
    .pg-card:hover{ transform: translateY(-4px); box-shadow: 0 20px 44px rgba(10,30,45,.24); }
    @keyframes pgIn{ from{ opacity: 0; transform: translateY(16px) scale(.985); } }

    .pg-media{ position: absolute; inset: 0; z-index: 0; background: #0b151b; }
    .pg-card.is-light .pg-media{ background: #f2f4f6; }
    .pg-media img,
    .pg-media video{
      width: 100%; height: 100%; display: block; object-fit: cover;
      transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }
    .pg-card:hover .pg-media img,
    .pg-card:hover .pg-media video{ transform: scale(1.06); }
    .pg-media .pg-loop{ position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
    .pg-card.is-playing .pg-loop{ opacity: 1; }

    /* Fallback when a thumbnail path is wrong */
    .pg-fallback{
      position: absolute; inset: 0; display: none; place-items: center; padding: 20px; text-align: center;
      background: radial-gradient(circle at 25% 20%, rgba(88,183,212,.35), transparent 50%), linear-gradient(135deg,#123040,#0b151b);
      color: rgba(255,255,255,.7); font-size: 30px;
    }
    .pg-card.media-error .pg-fallback{ display: grid; }
    .pg-card.media-error .pg-media img{ display: none; }

    /* Readability shade */
    .pg-card::after{
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to top, rgba(5,12,17,.93) 0%, rgba(5,12,17,.62) 30%, rgba(5,12,17,.08) 62%, rgba(5,12,17,0) 100%);
      transition: opacity .3s ease;
    }

    .pg-card:hover::after,
    .pg-card:focus-within::after{
      background: linear-gradient(to top, rgba(5,12,17,.95) 0%, rgba(5,12,17,.78) 42%, rgba(5,12,17,.2) 78%, rgba(5,12,17,.05) 100%);
    }

    /* Text overlay */
    .pg-overlay{ position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px 15px 14px; color: #fff; pointer-events: none; }
    .pg-kicker{
      color: #8fd8ee; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    }
    .pg-title{
      margin: 3px 0 0; color: #fff; font-size: 15px; line-height: 1.28; font-weight: 800; letter-spacing: -.2px;
      text-shadow: 0 1px 12px rgba(0,0,0,.35);
    }
    .pg-meta{
      margin-top: 4px; overflow: hidden; color: rgba(255,255,255,.74);
      font-size: 10px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis;
    }
    .pg-desc{
      max-height: 0; margin: 0; overflow: hidden; opacity: 0;
      color: rgba(255,255,255,.84); font-size: 11px; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      transition: max-height .4s ease, opacity .3s ease, margin .3s ease;
    }
    .pg-card:hover .pg-desc,
    .pg-card:focus-within .pg-desc{ max-height: 54px; margin-top: 7px; opacity: 1; }
    .pg-grid:not(.is-filtered) .size-tall .pg-desc{ max-height: 72px; margin-top: 7px; opacity: 1; -webkit-line-clamp: 4; }
    .pg-cta{ display: none; }

    /* Badges */
    .pg-badges{
      position: absolute; top: 11px; left: 11px; right: 54px; z-index: 3;
      display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
    }
    .pg-badge{
      padding: 5px 9px; border-radius: 999px;
      background: rgba(255,255,255,.93); color: #14232c;
      box-shadow: 0 4px 14px rgba(0,0,0,.16); backdrop-filter: blur(8px);
      font-size: 9.5px; line-height: 1.2; font-weight: 800;
    }
    .pg-new{
      padding: 5px 8px; border-radius: 999px; background: #d9480f; color: #fff;
      box-shadow: 0 4px 14px rgba(217,72,15,.35);
      font-size: 8.5px; line-height: 1.3; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    }

    /* Whole-card preview button + small "open in new tab" link */
    .pg-hit{
      position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%;
      padding: 0; border: 0; border-radius: inherit; background: transparent; cursor: pointer;
    }
    .pg-hit:focus-visible{ outline: 3px solid #58b7d4; outline-offset: -3px; }
    .pg-open{
      position: absolute; top: 10px; right: 10px; z-index: 4; width: 34px; height: 34px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.28); border-radius: 10px;
      background: rgba(10,20,26,.62); color: #fff; backdrop-filter: blur(8px);
      font-size: 14px; font-weight: 800;
      opacity: 0; transform: translateY(-4px);
      transition: opacity .2s ease, transform .2s ease, background .2s ease;
    }
    .pg-open:hover{ background: #146f8d; }
    .pg-open:focus-visible{ opacity: 1; transform: none; outline: 3px solid #58b7d4; outline-offset: 2px; }
    .pg-card:hover .pg-open{ opacity: 1; transform: none; }

    /* Video progress line */
    .pg-progress{
      position: absolute; left: 0; bottom: 0; z-index: 4; width: 0; height: 3px;
      background: linear-gradient(90deg, #58b7d4, #68bea7); pointer-events: none;
    }

    /* Featured card: video on top, info band below */
    .pg-grid:not(.is-filtered) .pg-card.size-feature{ display: flex; flex-direction: column; }
    .pg-grid:not(.is-filtered) .size-feature .pg-media{ position: relative; inset: auto; flex: 1 1 auto; min-height: 0; }
    .pg-grid:not(.is-filtered) .size-feature::after{ display: none; }
    .pg-grid:not(.is-filtered) .size-feature .pg-progress{ bottom: auto; top: 0; }
    .pg-grid:not(.is-filtered) .size-feature .pg-overlay{
      position: relative; flex: 0 0 auto;
      display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 18px; align-items: center;
      padding: 12px 16px 13px;
      background: linear-gradient(180deg,#10202a,#0b151b); border-top: 1px solid rgba(255,255,255,.07);
    }
    .pg-grid:not(.is-filtered) .size-feature .pg-title{ font-size: 18px; letter-spacing: -.4px; }
    .pg-grid:not(.is-filtered) .size-feature .pg-desc{ display: none; }
    .pg-grid:not(.is-filtered) .size-feature .pg-cta{
      grid-column: 2; grid-row: 1 / span 4;
      padding: 10px 15px; display: inline-flex; align-items: center; gap: 7px;
      border-radius: 11px; background: #146f8d; color: #fff;
      font-size: 12px; font-weight: 800; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(20,111,141,.35);
      transition: background .2s ease, transform .2s ease;
    }
    .pg-grid:not(.is-filtered) .size-feature:hover .pg-cta{ background: #1a86aa; transform: translateY(-1px); }
    .pg-grid:not(.is-filtered) .size-feature .pg-text{ grid-column: 1; min-width: 0; }

    /* Show all */
    .pg-more{ margin-top: 16px; display: flex; justify-content: center; }
    .pg-more .button{ min-width: 210px; }
    .pg-empty{ grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--text-soft); font-size: 12px; }

    /* Full viewer (modal) */
    .recent-project-modal-backdrop{
      position: fixed; inset: 0; z-index: 9000; padding: 18px;
      display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0;
      background: rgba(5,12,17,.86); backdrop-filter: blur(10px);
      transition: opacity .2s ease, visibility .2s ease;
    }
    .recent-project-modal-backdrop.show{ visibility: visible; opacity: 1; }
    .recent-project-modal{
      width: min(1500px,96vw); height: min(900px,93vh); overflow: hidden;
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 17px;
      background: var(--surface); box-shadow: 0 35px 120px rgba(0,0,0,.45);
      transform: translateY(12px) scale(.99); transition: transform .25s ease;
    }
    .recent-project-modal-backdrop.show .recent-project-modal{ transform: none; }
    .recent-project-modal-head{
      min-height: 60px; padding: 10px 14px 10px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
      border-bottom: 1px solid var(--border);
    }
    .pv-heading{ min-width: 0; display: flex; align-items: center; gap: 11px; }
    .pv-count{
      flex: 0 0 auto; padding: 5px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .pv-titles{ min-width: 0; }
    .recent-project-modal-title{
      overflow: hidden; color: var(--text); font-size: 14px; line-height: 1.3; font-weight: 800;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .pv-meta{ overflow: hidden; color: var(--text-soft); font-size: 10.5px; white-space: nowrap; text-overflow: ellipsis; }
    .recent-project-modal-actions{ flex: 0 0 auto; display: flex; align-items: center; gap: 7px; }
    .pv-nav{ width: 40px; padding: 0; font-size: 15px; }
    .recent-project-modal-body{ position: relative; flex: 1; min-height: 0; background: #0b1216; }
    .recent-project-modal-body iframe{ width: 100%; height: 100%; display: block; border: 0; background: #0b1216; }
    .recent-project-modal-body img,
    .recent-project-modal-body video{ width: 100%; height: 100%; display: block; object-fit: contain; background: #0b1216; }
    .recent-project-modal-body.is-light,
    .recent-project-modal-body.is-light img{ background: #eef2f4; }
    .pv-loading{
      position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      color: rgba(255,255,255,.7); font-size: 11px; font-weight: 700; letter-spacing: .06em;
    }
    .pv-loading::before{
      content: ""; width: 30px; height: 30px; margin: 0 auto 10px; display: block;
      border: 3px solid rgba(255,255,255,.15); border-top-color: #58b7d4; border-radius: 50%;
      animation: pvSpin .8s linear infinite;
    }
    @keyframes pvSpin{ to{ transform: rotate(360deg); } }
    .pv-external{
      position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff;
    }
    .pv-external img{ position: absolute; inset: 0; object-fit: cover; opacity: .14; filter: blur(4px); }
    .pv-external div{ position: relative; max-width: 420px; }
    .pv-external p{ margin: 0 0 16px; color: #fff; font-size: 13px; line-height: 1.6; }

    /* Responsive */
    @media(max-width:760px){
      .pg-grid{ grid-template-columns: repeat(2,minmax(0,1fr)); grid-auto-rows: 200px; gap: 12px; }
      @supports (width: 1cqw){
        .pg-grid{ grid-auto-rows: calc((100cqw - 12px) / 2 / 1.45); }
      }
      .pg-stats{ width: 100%; }
      .pg-stat{ flex: 1; }
    }
    @media(max-width:560px){
      .pg-grid{ grid-template-columns: 1fr; grid-auto-rows: auto; }
      .pg-grid .pg-card{ grid-column: auto !important; grid-row: auto !important; aspect-ratio: 16 / 11; }
      .pg-grid:not(.is-filtered) .pg-card.size-tall{ aspect-ratio: 4 / 5; }
      .pg-grid:not(.is-filtered) .pg-card.size-feature{ aspect-ratio: auto; }
      .pg-grid:not(.is-filtered) .size-feature .pg-media{ flex: none; aspect-ratio: 16 / 9; }
      .pg-grid:not(.is-filtered) .size-feature .pg-overlay{ grid-template-columns: 1fr; row-gap: 12px; }
      .pg-grid:not(.is-filtered) .size-feature .pg-cta{ grid-column: 1; grid-row: auto; justify-self: start; }
      .pg-desc{ max-height: 54px; margin-top: 7px; opacity: 1; -webkit-line-clamp: 2; }
      .pv-count, .pv-meta, .recent-modal-open-text{ display: none; }
      .recent-project-modal-backdrop{ padding: 7px; }
      .recent-project-modal{ width: 100%; height: 96vh; border-radius: 12px; }
    }
    @media(hover:none){
      .pg-open{ opacity: 1; transform: none; }
    }
    @media(prefers-reduced-motion:reduce){
      .pg-card{ animation: none; }
      .pg-card:hover .pg-media img,
      .pg-card:hover .pg-media video{ transform: none; }
    }
    .pg-card[hidden]{ display: none !important; }
    /* Cards animate in when the section scrolls into view */
    #recent-projects.reveal:not(.visible) .pg-card{ animation: none; }

    /* =====================================================
       14. THESIS
       ===================================================== */
    .thesis-layout{ display: grid; grid-template-columns: 1fr; align-items: start; gap: 20px; }
    .thesis-info{ order: 1; width: 100%; max-width: 980px; }
    .thesis-info h3{ margin: 0 0 9px; color: var(--text); font-size: 21px; line-height: 1.4; font-weight: 800; letter-spacing: -.3px; }
    .thesis-info p{
      max-width: 900px; margin: 0; color: var(--text-soft); font-size: 12.5px; line-height: 1.75;
      text-align: justify; text-justify: inter-word; hyphens: auto;
    }
    .thesis-tags{ margin-top: 13px; display: flex; flex-wrap: wrap; gap: 7px; }
    .thesis-image{
      order: 2; width: min(100%, 820px); justify-self: center; overflow: hidden;
      border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface-soft); box-shadow: 0 5px 18px rgba(30,55,70,.07);
    }
    .thesis-image img{ width: 100%; height: auto; display: block; object-fit: contain; transition: transform .3s ease; }
    .thesis-image:hover img{ transform: scale(1.012); }

    /* =====================================================
       15. ACADEMIC PROJECTS — studio cards
       Each card opens Academic/<Studio>/index.html
       ===================================================== */
    .ac-head{ flex-wrap: wrap; }
    .ac-stats{ flex: 0 0 auto; display: flex; gap: 7px; }
    .ac-stat{ min-width: 74px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-soft); }
    .ac-stat strong{ display: block; color: var(--text); font-size: 20px; line-height: 1; font-weight: 800; letter-spacing: -.5px; }
    .ac-stat span{ display: block; margin-top: 5px; color: var(--text-soft); font-size: 8.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }

    .ac-toolbar{ margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .ac-search{ flex: 1 1 240px; position: relative; }
    .ac-search input{
      width: 100%; padding: 10px 12px 10px 34px; outline: none;
      border: 1px solid var(--border); border-radius: 11px; background: var(--surface-soft); color: var(--text); font-size: 12px;
    }
    .ac-search::before{ content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--text-soft); font-size: 15px; }
    .ac-search input:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ac-filters{ display: flex; flex-wrap: wrap; gap: 7px; }
    .ac-chip{
      padding: 7px 8px 7px 12px; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-soft);
      cursor: pointer; font-size: 11px; font-weight: 800;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .ac-chip:hover{ color: var(--text); transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .ac-chip .n{ min-width: 21px; padding: 2px 6px; border-radius: 999px; background: var(--surface-hover); font-size: 9.5px; line-height: 1.3; text-align: center; }
    .ac-chip.active{ border-color: var(--accent); background: var(--accent); color: #fff; }
    .ac-chip.active .n{ background: rgba(255,255,255,.22); color: #fff; }
    html[data-theme="dark"] .ac-chip.active{ color: #06222c; }
    html[data-theme="dark"] .ac-chip.active .n{ background: rgba(0,0,0,.16); color: #06222c; }

    .ac-grid{ display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .ac-card{
      position: relative; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
      transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .28s ease;
      animation: acIn .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 50ms);
    }
    .ac-card:hover{ transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .ac-card:focus-visible{ outline: 3px solid var(--accent); outline-offset: 2px; }
    .ac-card[hidden]{ display: none !important; }
    @keyframes acIn{ from{ opacity: 0; transform: translateY(14px); } }
    #academic-projects.reveal:not(.visible) .ac-card{ animation: none; }

    .ac-cover{ position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #e9eef1; }
    .ac-cover img{ width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
    .ac-card:hover .ac-cover img{ transform: scale(1.06); }
    .ac-cover::after{ content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,20,27,.45), transparent 45%); pointer-events: none; }
    .ac-cover.stat{ display: grid; place-content: center; text-align: center; color: #fff;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 45%), linear-gradient(135deg, #146f8d, #388874); }
    .ac-cover.stat::after{ display: none; }
    .ac-cover.stat strong{ font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; }
    .ac-cover.stat span{ margin-top: 6px; font-size: 11.5px; font-weight: 700; opacity: .92; }
    .ac-num{
      position: absolute; top: 10px; left: 10px; z-index: 1; padding: 5px 9px; border-radius: 999px;
      background: rgba(255,255,255,.94); color: #14232c; font-size: 10px; font-weight: 800; letter-spacing: .04em;
      box-shadow: 0 4px 14px rgba(0,0,0,.14);
    }
    .ac-count{
      position: absolute; right: 10px; bottom: 10px; z-index: 1; padding: 5px 9px; border-radius: 999px;
      background: rgba(10,20,26,.66); color: #fff; font-size: 10px; font-weight: 700; backdrop-filter: blur(6px);
    }
    .ac-body{ flex: 1; display: flex; flex-direction: column; padding: 14px 15px 15px; }
    .ac-kicker{ color: var(--accent); font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .ac-card h3{ margin: 5px 0 0; color: var(--text); font-size: 15px; line-height: 1.3; font-weight: 800; letter-spacing: -.2px; }
    .ac-card p{
      margin: 6px 0 0; color: var(--text-soft); font-size: 11.5px; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ac-foot{ margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ac-meta{ display: flex; flex-wrap: wrap; gap: 5px; }
    .ac-meta span{ padding: 3px 7px; border-radius: 999px; background: var(--surface-soft); color: var(--text-soft); font-size: 9.5px; font-weight: 700; }
    .ac-go{ flex: 0 0 auto; color: var(--accent); font-size: 11px; font-weight: 800; white-space: nowrap; transition: transform .2s ease; }
    .ac-card:hover .ac-go{ transform: translateX(3px); }
    .ac-grid:not(.is-expanded):not(.is-filtered) .ac-card.is-extra{ display: none; }
    .ac-empty{ padding: 26px; border: 1px dashed var(--border); border-radius: 14px; color: var(--text-soft); font-size: 12px; text-align: center; }
    .show-more-wrap{ margin-top: 16px; text-align: center; }
    .show-more-wrap .button{ min-width: 210px; }

    /* =====================================================
       16. EXPERIENCE
       ===================================================== */
    .experience-card{
      padding: 20px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 18px;
      border: 1px solid var(--border); border-radius: 13px; background: var(--surface-soft);
    }
    .experience-role{ margin: 0; font-size: 16px; font-weight: 800; }
    .experience-company{ margin-top: 4px; color: var(--accent); font-size: 11px; font-weight: 700; }
    .experience-description{ max-width: 760px; margin: 9px 0 0; color: var(--text-soft); font-size: 11px; line-height: 1.65; }

    /* =====================================================
       17. ACHIEVEMENTS & CERTIFICATES
       ===================================================== */
    .achievement-grid{ display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .achievement-card{
      overflow: hidden; display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 13px; background: var(--surface-soft);
    }
    .achievement-images{ height: 160px; overflow: hidden; display: flex; gap: 4px; background: var(--surface-hover); }
    .achievement-images img{ width: 100%; min-width: 0; object-fit: cover; }
    /* Certificate images: whole certificate visible, click to enlarge */
    .achievement-images.certificate{
      width: 100%; padding: 10px; border: 0;
      align-items: center; justify-content: center;
      cursor: zoom-in;
    }
    .achievement-images.certificate img{
      width: 100%; height: 100%; object-fit: contain; border-radius: 4px;
      transition: transform .25s ease;
    }
